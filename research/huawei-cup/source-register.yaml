do_not_treat_as_official:
  - Any fixed 100-point official rubric with published weights
  - Exact similarity or AI-detection thresholds
  - 2025 AI annex automatically binding 2026
  - GitHub folder labels as award proof
  - Official 优秀作品 KDocs (promo PPTX)
  - Commercial 'standard answers' and blog scoring sheets
  - CUMCM undergraduate review points as CPMCM national rules
  - CUMCM/MCM skill quotas (20 pages, 8 figures, 国一≥85) as Huawei Cup rules
